name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: skills/*/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r skills/genome-reader/requirements.txt -r skills/genome-decoder/requirements.txt pytest
      # genome-reader and genome-decoder each ship a scripts/_common.py and a
      # tests/conftest.py that prepend their own scripts/ dir to sys.path. Run
      # them in separate pytest processes so the two _common modules cannot
      # collide in sys.modules.
      - name: Run genome-reader tests
        run: pytest skills/genome-reader/tests/ -q
      - name: Run genome-decoder tests
        run: pytest skills/genome-decoder/tests/ -q
